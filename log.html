<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JSONL 日志展示</title>
    <style>
        :root {
            --bg: #f6f8fc;
            --panel: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --line: #e5e7eb;
            --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
            --radius: 16px;
            --primary: #2563eb;
            --code-bg: #0f172a;
            --code-text: #e2e8f0;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(180deg, #f8fbff 0%, var(--bg) 100%);
            color: var(--text);
        }

        .wrap {
            max-width: 1100px;
            margin: 0 auto;
            padding: 32px 20px 48px;
        }

        .header {
            display: flex;
            gap: 16px;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .title h1 {
            margin: 0 0 8px;
            font-size: 28px;
            line-height: 1.2;
        }

        .title p {
            margin: 0;
            color: var(--muted);
            font-size: 14px;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            padding: 14px;
            background: rgba(255, 255, 255, 0.75);
            border: 1px solid rgba(229, 231, 235, 0.9);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            backdrop-filter: blur(8px);
            margin-bottom: 18px;
        }

        button,
        .file-label {
            border: 0;
            background: var(--primary);
            color: white;
            padding: 10px 14px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 6px 18px rgba(37, 99, 235, 0.18);
        }

        button.secondary {
            background: #111827;
        }

        button.ghost {
            background: #eef2ff;
            color: #3730a3;
            box-shadow: none;
            border: 1px solid #c7d2fe;
        }

        input[type="file"] {
            display: none;
        }

        .hint {
            color: var(--muted);
            font-size: 13px;
            margin-left: auto;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 18px;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 16px;
        }

        .metric-label {
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 8px;
        }

        .metric-value {
            font-size: 24px;
            font-weight: 700;
        }

        .log-list {
            display: grid;
            gap: 14px;
        }

        .log-item {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .log-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 16px 18px;
            border-bottom: 1px solid var(--line);
            background: linear-gradient(180deg, #fff 0%, #fbfdff 100%);
        }

        .log-head-left {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .index-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 32px;
            height: 32px;
            padding: 0 10px;
            border-radius: 999px;
            background: #e0e7ff;
            color: #3730a3;
            font-weight: 700;
            font-size: 13px;
        }

        .section-badge {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 999px;
            background: #eff6ff;
            color: #1d4ed8;
            font-size: 12px;
            font-weight: 700;
        }

        .content {
            padding: 16px 18px 18px;
        }

        .field {
            margin-bottom: 14px;
        }

        .field:last-child {
            margin-bottom: 0;
        }

        .field-label {
            display: inline-block;
            margin-bottom: 8px;
            font-size: 13px;
            color: var(--muted);
            font-weight: 700;
        }

        .field-value {
            white-space: pre-wrap;
            line-height: 1.7;
            font-size: 14px;
            background: #f8fafc;
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 12px 14px;
            overflow-x: auto;
        }

        .field-value.code {
            background: var(--code-bg);
            color: var(--code-text);
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 13px;
        }

        details {
            margin-top: 6px;
            border-top: 1px dashed var(--line);
            padding-top: 10px;
        }

        summary {
            cursor: pointer;
            color: var(--primary);
            font-weight: 700;
            font-size: 13px;
            list-style: none;
        }

        summary::-webkit-details-marker {
            display: none;
        }

        .empty {
            padding: 30px;
            text-align: center;
            color: var(--muted);
            background: var(--panel);
            border: 1px dashed #cbd5e1;
            border-radius: var(--radius);
        }

        .error {
            color: #b91c1c;
            background: #fef2f2;
            border-color: #fecaca;
        }

        .footer-note {
            margin-top: 18px;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.6;
        }

        @media (max-width: 640px) {
            .log-head {
                align-items: flex-start;
                flex-direction: column;
            }

            .hint {
                margin-left: 0;
            }
        }
    </style>
</head>

<body>
    <div class="wrap">
        <div class="header">
            <div class="title">
                <h1>JSONL 日志展示</h1>
                <p>自动读取 <code>log.jsonl</code>，按记录分组展示每条日志内容。</p>
            </div>
        </div>

        <div class="toolbar">
            <button id="btnLoad">重新加载 log.jsonl</button>
            <label class="file-label" for="fileInput">选择本地 JSONL 文件</label>
            <input id="fileInput" type="file" accept=".jsonl,.txt,.log,application/json,text/plain" />
            <button class="ghost" id="btnDemo">加载示例数据</button>
            <span class="hint">提示：如直接双击打开页面，浏览器可能无法读取同目录文件，建议通过本地服务器访问。</span>
        </div>

        <div class="summary" id="summary"></div>
        <div class="log-list" id="logList"></div>

        <div class="footer-note">
            支持的输入格式：每一行是一个 JSON 对象（JSONL）。若某一行不是合法 JSON，会在页面中提示错误，但不会影响其它行的展示。
        </div>
    </div>

    <script>
        const logList = document.getElementById('logList');
        const summary = document.getElementById('summary');
        const fileInput = document.getElementById('fileInput');
        const btnLoad = document.getElementById('btnLoad');
        const btnDemo = document.getElementById('btnDemo');

        const demoText = `{"section": "用户提问", "content": "<question>查询常州供电公司的地址</question>"}
{"section": "思考", "content": "<thought>\\n用户想查询常州供电公司的地址。我需要通过工具来获取这个信息，例如执行网络搜索或调用相关API。首先，我试试用Python来搜索这个信息。\\n</thought>"}
{"section": "行动", "content": "<action>\\n<exec_python>\\n<code>\\nimport requests\\nfrom bs4 import BeautifulSoup\\n\\nsearch_query = \\"常州供电公司 地址\\"\\nurl = f\\"https://www.baidu.com/s?wd={search_query}\\"\\nheaders = {\\"User-Agent\\": \\"Mozilla/5.0\\"}\\nresp = requests.get(url, headers=headers, timeout=10)\\nprint(resp.status_code)\\n</code>\\n</exec_python>\\n</action>"}`;

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function isCodeLike(text) {
            return /<action>[\s\S]*<\/action>/.test(text);
        }

        function renderValue(text) {
            const escaped = escapeHtml(text);
            if (isCodeLike(text)) {
                return `<div class="field-value code">${escaped}</div>`;
            }
            return `<div class="field-value">${escaped}</div>`;
        }

        function renderRecords(records, sourceLabel = 'log.jsonl') {
            const valid = records.filter(Boolean);
            summary.innerHTML = `
        <div class="card"><div class="metric-label">数据源</div><div class="metric-value" style="font-size:18px">${escapeHtml(sourceLabel)}</div></div>
        <div class="card"><div class="metric-label">记录数</div><div class="metric-value">${valid.length}</div></div>
        <div class="card"><div class="metric-label">状态</div><div class="metric-value">已加载</div></div>
      `;

            if (!valid.length) {
                logList.innerHTML = '<div class="empty">没有可显示的日志。</div>';
                return;
            }

            logList.innerHTML = valid.map((item, idx) => {
                const section = item.section ?? '未命名';
                const content = item.content ?? '';
                const title = item.title ?? '';
                const extra = Object.entries(item)
                    .filter(([k]) => !['section', 'content', 'title'].includes(k))
                    .map(([k, v]) => `<div class="field"><span class="field-label">${escapeHtml(k)}</span>${renderValue(typeof v === 'string' ? v : JSON.stringify(v, null, 2))}</div>`)
                    .join('');

                return `
          <article class="log-item">
            <div class="log-head">
              <div class="log-head-left">
                <span class="index-badge">${idx + 1}</span>
                <span class="section-badge">${escapeHtml(section)}</span>
                ${title ? `<strong>${escapeHtml(title)}</strong>` : ''}
              </div>
            </div>
            <div class="content">
              <div class="field">
                <span class="field-label">内容</span>
                ${renderValue(content)}
              </div>
              ${extra ? `<details><summary>查看更多字段</summary><div style="margin-top:12px">${extra}</div></details>` : ''}
            </div>
          </article>
        `;
            }).join('');
        }

        function parseJsonl(text) {
            const lines = text.split(/\r?\n/);
            const records = [];
            const errors = [];

            lines.forEach((line, i) => {
                const trimmed = line.trim();
                if (!trimmed) return;
                try {
                    records.push(JSON.parse(trimmed));
                } catch (err) {
                    errors.push(`第 ${i + 1} 行解析失败：${trimmed.slice(0, 80)}`);
                }
            });

            return { records, errors };
        }

        function showErrors(errors) {
            if (!errors.length) return;
            const errorCard = `
        <div class="card error">
          <div class="metric-label" style="color:#b91c1c">解析提示</div>
          <div style="white-space:pre-wrap; line-height:1.6; font-size:13px">${escapeHtml(errors.join('\n'))}</div>
        </div>
      `;
            summary.insertAdjacentHTML('afterend', errorCard);
        }

        async function loadFromUrl(url = 'log.jsonl') {
            logList.innerHTML = '<div class="empty">正在加载...</div>';
            summary.innerHTML = '';
            try {
                const res = await fetch(url, { cache: 'no-store' });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const text = await res.text();
                const { records, errors } = parseJsonl(text);
                renderRecords(records, url);
                if (errors.length) showErrors(errors);
            } catch (err) {
                logList.innerHTML = '<div class="empty">无法直接读取 log.jsonl。你可以通过本地服务器打开页面，或使用“选择本地 JSONL 文件”。</div>';
                summary.innerHTML = `
          <div class="card"><div class="metric-label">数据源</div><div class="metric-value" style="font-size:18px">${escapeHtml(url)}</div></div>
          <div class="card"><div class="metric-label">状态</div><div class="metric-value" style="font-size:18px;color:#b91c1c">加载失败</div></div>
          <div class="card"><div class="metric-label">原因</div><div class="metric-value" style="font-size:18px">${escapeHtml(err.message)}</div></div>
        `;
            }
        }

        btnLoad.addEventListener('click', () => loadFromUrl('log.jsonl'));

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files && e.target.files[0];
            if (!file) return;
            const text = await file.text();
            const { records, errors } = parseJsonl(text);
            renderRecords(records, file.name);
            if (errors.length) showErrors(errors);
        });

        btnDemo.addEventListener('click', () => {
            const { records, errors } = parseJsonl(demoText);
            renderRecords(records, '内置示例');
            if (errors.length) showErrors(errors);
        });

        loadFromUrl('log.jsonl');
    </script>
</body>

</html>
